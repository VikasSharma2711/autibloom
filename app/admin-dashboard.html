<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUTIBLOOM Admin</title><style>body{font-family:system-ui;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:18px;margin:12px 0}.metric{font-size:28px;font-weight:800}</style></head><body><div class="wrap"><h1>AUTIBLOOM</h1><p>Administration &amp; Operations</p><div id="metrics" class="grid"></div><div class="card"><h2>Audit, Operations &amp; Analytics</h2><p>Protected administrator controls.</p></div></div><script>async function load(){const r=await fetch('/api/v1/admin/dashboard',{credentials:'include'}),d=await r.json();if(!r.ok){document.getElementById('metrics').textContent=d.error||'Access denied';return}document.getElementById('metrics').innerHTML=Object.entries(d.metrics).map(([k,v])=>'<div class="card"><small>'+k+'</small><div class="metric">'+v+'</div></div>').join('')}load()</script></body></html>
