<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUTIBLOOM — Therapist Dashboard</title><style>body{font-family:system-ui;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1050px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:20px;margin:14px 0}.report{padding:14px;border:1px solid #e5eaf1;border-radius:12px;margin:10px 0;cursor:pointer}button{padding:10px 14px;border:0;border-radius:9px;margin:4px}textarea{width:100%;min-height:80px}</style></head><body><div class="wrap"><h1>AUTIBLOOM</h1><p>Therapist Clinical Dashboard</p><div class="card"><h2>Reports</h2><div id="list">Loading…</div></div><div class="card" id="detail" style="display:none"></div></div><script>const e=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));async function a(p,o={}){let r=await fetch(p,{credentials:"include",headers:{"Content-Type":"application/json"},...o}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"REQUEST_FAILED");return d}async function load(){try{let d=await a("/api/v1/therapist/dashboard");list.innerHTML=d.reports.map(x=>`<div class=report onclick="openR('${e(x.id)}')"><b>${e(x.child_name)}</b><br>${e(x.status)}</div>`).join("")||"No reports found."}catch(x){list.textContent=x.message}}async function openR(id){let d=await a("/api/v1/therapist/reports/"+encodeURIComponent(id)),r=d.report;detail.style.display="block";detail.innerHTML=`<h2>${e(r.child_name)}</h2><p>${e(typeof r.parent_summary==="string"?r.parent_summary:(r.parent_summary?.text||""))}</p><textarea id=n placeholder="Clinical review note"></textarea><div><button onclick="review('${e(id)}','RETURNED')">Return to Draft</button><button onclick="review('${e(id)}','SUBMITTED_FOR_REVIEW')">Submit for Review</button><button onclick="review('${e(id)}','APPROVED')">Approve</button><button onclick="releaseR('${e(id)}')">Release to Parent</button></div><h3>Review History</h3>${d.review_history.map(x=>`<p><b>${e(x.action)}</b> · ${e(x.created_at)}<br>${e(x.note||"")}</p>`).join("")||"No review history."}`}async function review(id,x){await a("/api/v1/therapist/reports/"+encodeURIComponent(id)+"/review",{method:"POST",body:JSON.stringify({action:x,note:n.value})});await load();await openR(id)}async function releaseR(id){if(!confirm("Release this report to the verified parent portal?"))return;await a("/api/v1/therapist/reports/"+encodeURIComponent(id)+"/release",{method:"POST",body:JSON.stringify({note:n.value})});await load();await openR(id)}load()</script></body></html>
