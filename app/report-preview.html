<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUTIBLOOM Report Preview</title><style>body{margin:0;background:#eef1f5;font-family:system-ui}.toolbar{position:sticky;top:0;background:#fff;padding:12px;display:flex;gap:10px}.frame{width:min(900px,calc(100% - 32px));height:calc(100vh - 60px);margin:16px auto;background:#fff;border:0;display:block}button{padding:10px 14px;border:0;border-radius:9px;font-weight:700}</style></head><body><div class="toolbar"><button onclick="window.print()">Print / Save as PDF</button><span>Production can use a controlled server-side PDF renderer.</span></div><iframe id="report" class="frame"></iframe><script>const id=new URLSearchParams(location.search).get('id');if(id)document.getElementById('report').src='/api/v1/therapist/reports/'+encodeURIComponent(id)+'/html';else document.getElementById('report').srcdoc='<h2>Missing report ID.</h2>';</script></body></html>
